<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - No Dues System</title>
    <link rel="stylesheet" href="styles/login.css">
    <style>
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
        }
        .success-message {
            color: #28a745;
            text-align: center;
            margin-bottom: 15px;
        }
        .welcome-text {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }
        .password-requirements {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Set Your Password</h2>
            <p class="welcome-text" id="welcomeText">Loading...</p>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
            
            <form id="setPasswordForm" style="display: none;">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <p class="password-requirements">Minimum 8 characters</p>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
                </div>
                <button type="submit" id="submitBtn">Set Password</button>
            </form>
            
            <div id="loginLink" style="text-align: center; margin-top: 20px; display: none;">
                <a href="/login.html">Go to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const welcomeText = document.getElementById('welcomeText');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const form = document.getElementById('setPasswordForm');
            const loginLink = document.getElementById('loginLink');

            if (!token) {
                welcomeText.style.display = 'none';
                errorMessage.textContent = 'Invalid or missing token. Please check your email link.';
                errorMessage.style.display = 'block';
                loginLink.style.display = 'block';
                return;
            }

            // Verify token
            try {
                const res = await fetch(`/verify-token?token=${token}`);
                const data = await res.json();

                if (data.valid) {
                    welcomeText.textContent = `Welcome, ${data.name}! Please set your password.`;
                    form.style.display = 'block';
                } else {
                    welcomeText.style.display = 'none';
                    errorMessage.textContent = data.error || 'Invalid or expired token.';
                    errorMessage.style.display = 'block';
                    loginLink.style.display = 'block';
                }
            } catch (err) {
                welcomeText.style.display = 'none';
                errorMessage.textContent = 'Failed to verify token. Please try again.';
                errorMessage.style.display = 'block';
            }

            // Handle form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match.';
                    errorMessage.style.display = 'block';
                    return;
                }

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Setting Password...';

                try {
                    const res = await fetch('/set-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, password })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        form.style.display = 'none';
                        welcomeText.style.display = 'none';
                        successMessage.textContent = 'Password set successfully! You can now login.';
                        successMessage.style.display = 'block';
                        loginLink.style.display = 'block';
                    } else {
                        errorMessage.textContent = data.error || 'Failed to set password.';
                        errorMessage.style.display = 'block';
                    }
                } catch (err) {
                    errorMessage.textContent = 'An error occurred. Please try again.';
                    errorMessage.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set Password';
                }
            });
        });
    </script>
</body>
</html>
